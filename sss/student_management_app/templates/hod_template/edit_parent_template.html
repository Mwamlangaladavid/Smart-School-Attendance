{% extends 'hod_template/base_template.html' %}
{% block page_title %}
Edit Parent
{% endblock page_title %}
{% block main_content %}
<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="card card-primary">
                    <div class="card-header">
                        <h3 class="card-title">Edit Parent</h3>
                    </div>
                    <form role="form" method="POST" action="{% url 'edit_parent_save' %}">
                        {% csrf_token %}
                        <input type="hidden" name="parent_id" value="{{ parent.admin.id }}">
                        <div class="card-body">
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" class="form-control" name="first_name" value="{{ parent.admin.first_name }}" required>
                            </div>
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" class="form-control" name="last_name" value="{{ parent.admin.last_name }}" required>
                            </div>
                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" class="form-control" name="username" value="{{ parent.admin.username }}" required>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" class="form-control" name="email" value="{{ parent.admin.email }}" required>
                            </div>
                            <div class="form-group">
                                <label>Address</label>
                                <input type="text" name="address" class="form-control" value="{{ parent.address }}" required>
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="text" name="phone_number" class="form-control" value="{{ parent.phone_number }}" required>
                            </div>                            
                            <div class="form-group">
                                <label>Select Student</label>
                                <select class="form-control" name="student" required>
                                    {% for student in students %}
                                    <option value="{{ student.id }}" {% if student.id == parent.student.id %}selected{% endif %}>
                                        {{ student.first_name }} {{ student.last_name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button type="submit" class="btn btn-primary">Update Parent</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock main_content %}
